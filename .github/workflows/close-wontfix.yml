name: Close Wontfix Issues

on:
  issues:
    types: [labeled, reopened]

jobs:
  close-wontfix:
    runs-on: ubuntu-latest
    steps:
      - name: Close issues labeled wontfix
        uses: actions/github-script@v7
        with:
          script: |
            if (context.payload.label && context.payload.label.name === 'wontfix') {
              github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed'
              })
              console.log(`Closed issue ${context.issue.number} due to wontfix label`)
            }
